server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /app

spring:
  application:
    name: spring-boot-cloud-prototype-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL日志

security:
  jwt:
    secret: ${JWT_SECRET:[REDACTED]}
    ttl: ${JWT_TTL:PT15M}
  refresh-token:
    ttl: ${JWT_REFRESH_TOKEN_TTL:PT30D}

payment:
  paypal:
    # 开发默认关闭；上线前切换为true并注入密钥管理服务中的值。
    enabled: ${PAYPAL_ENABLED:false}
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    webhook-id: ${PAYPAL_WEBHOOK_ID:}
    brand-name: ${PAYPAL_BRAND_NAME:Cloud Album}
    return-url: ${PAYPAL_RETURN_URL:http://localhost:5173/plans}
    cancel-url: ${PAYPAL_CANCEL_URL:http://localhost:5173/plans}
    order-expire-minutes: ${PAYPAL_ORDER_EXPIRE_MINUTES:30}
    supported-currencies: ${PAYPAL_SUPPORTED_CURRENCIES:USD,EUR,GBP}


oss:
  obsType: MinIo # HwCloudObs 或 MinIo
  url: ${OSS_ENDPOINT:http://127.0.0.1:9000} # 使用华为云obs时，桶的区域必须正确
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: ${OSS_BUCKET:yl-img-bucket}
  callback-url: ${OSS_CALLBACK_URL:}
  download-url-ttl: ${OSS_DOWNLOAD_URL_TTL:P3D}
